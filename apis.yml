aid: investcloud
name: InvestCloud
description: >-
  InvestCloud is a wealth-management technology company that provides an AI-driven digital
  wealth platform connecting advisors, financial institutions, asset managers, TAMPs, RIAs and
  investors across the full investment lifecycle. Its product surface spans front-office advisor
  and client solutions, a wealth data platform ("Digital Warehouse") that aggregates custodial,
  market and portfolio data, managed account solutions including the Advisor Programs List (APL)
  and Private Markets Account, post-trade processing and settlement, revenue management, and the
  NaviPlan and RetireUp financial planning products acquired with Advicent. InvestCloud markets a
  developer platform — branded "Wealthsqope Digital Developer" — offering web-service APIs,
  embeddable widgets, code recipes, client libraries and application API keys, but that platform
  and its reference documentation sit entirely behind a portal login, and no machine-readable API
  contract is published publicly.
