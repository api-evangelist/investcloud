apis:
- name: Wealthsqope Digital Developer Platform
  description: >-
    InvestCloud's developer platform, branded "Wealthsqope Digital Developer". Its own public
    landing page advertises getting-started guides, "full API docs for web services and embedded
    widgets", video tutorials, pre-built code recipes, code-generation tools, client libraries for
    accessing the web services, and a command center for API usage stats and application API keys.
    Every one of those resources requires a portal login; no reference, no base URL and no
    machine-readable contract is reachable anonymously. baseURL is deliberately omitted rather than
    guessed — InvestCloud does not publish one, and api.investcloud.com does not resolve.
  humanURL: https://developer.investcloud.com/
